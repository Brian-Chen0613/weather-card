<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, transparent 49%, #c6d1eb 50%, transparent 51%),
                linear-gradient(-45deg, transparent 49%, #c7cad4 50%, transparent 51%);
            background-size: 50px 50px;
            /* 網格大小 */
        }

        .flex {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        #search {
            width: 170px;
            height: 25px;
        }

        #btn {
            height: 25px;
        }

        #card {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            margin-top: 10px;
        }

        #select {
            height: 25px;
        }

        .outlook {
            border: 1px solid black;
            border-radius: 20px;
        }

        h2 {
            margin: 0;
        }

        .title {
            background-color: #C8B4E6;
            padding: 10px;
            border-radius: 20px 20px 0 0;

        }

        .context {
            background-color: #F0FAF7;
            padding: 10px;
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>

<body>
    <section>
        <div class="flex">
            <label for="">
                <input type="text" placeholder="請輸入縣市" id="search">
            </label>
            <button type="button" id="btn">搜尋</button>
        </div>

        <div>
            <select name="" id="select">
                <option value="">選擇區域</option>
                <option value="北">北</option>
                <option value="中">中</option>
                <option value="南">南</option>
            </select>
        </div>
    </section>

    <section id="card"></section>

    <!-- url -->
    <!-- https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=CWA-3CDB286A-6CF0-4B27-85CB-FB2C17E68157 -->
    <script>
        let citys = [];
        let citysBackup = [];

        fetch('https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=CWA-3CDB286A-6CF0-4B27-85CB-FB2C17E68157')
            .then(response => response.json()) //第一步要先接收所有資料(還無法使用)
            // .then() -> 會把回傳的結果傳給下一個.then
            // .json() -> 把接收到的資料轉化為Javascript物件
            // 簡化前的function -> 
            // .then(function (response){
            //     return response.json();
            // })
            .then(data => { //第二步把接收的資料只取出需要的內容
                // 接收到res.json()轉化後的物件，裝進data這個參數內

                citys = data.records.location;
                citysBackup = data.records.location;

                showList();
            })
        .catch(error => alert(error)) //如果有報錯的情況下可以使用這個來處理

        // 按鈕搜尋
        const btn = document.querySelector('#btn');
        btn.addEventListener('click', () => {
            const search = document.querySelector('#search');
            citys = citysBackup.filter((e) => {
                return e.locationName.includes(search.value); //字串有沒有包含搜尋的字
                // includes對於空字串都會回傳true，所以filter會全部保留
            })
            search.value = '';
            showList();
        })

        // 選單搜尋
        const regionMap = {
            // 將區域化分為北中南
            '北': ['臺北市', '新北市', '基隆市', '桃園市', '新竹市', '新竹縣', '宜蘭縣'],
            '中': ['臺中市', '苗栗縣', '彰化縣', '南投縣', '雲林縣'],
            '南': ['臺南市', '高雄市', '嘉義市', '嘉義縣', '屏東縣'],
        }
        const select = document.querySelector('#select');

        select.addEventListener('change', () => {
            if (select.value === '') {
                citys = citysBackup;
            } else {
                citys = citysBackup.filter((city) => {
                    return regionMap[select.value].includes(city.locationName);
                    // 用regionMap來比對city的地點名稱，有相同的才保留，沒有的去除
                })
            }
            showList();
        })

        // 畫面更新
        function showList() {
            const card = document.querySelector('#card');
            card.innerHTML = '';
            citys.forEach((value, key) => {
                card.innerHTML += `
                    <div class='outlook'>
                        <div class='title'>
                            <h2>${value.locationName}</h2>
                        </div>

                        <div class='context'>
                            <div>
                            <span>${returnText(value.weatherElement, 0)}</span>
                            </div>

                            <div>
                            <span>降雨機率：</span>
                            <span>${returnText(value.weatherElement, 1)}%</span>
                            </div>
                        
                            <div>
                            <span>${returnText(value.weatherElement, 3)}</span>
                            </div>
                        
                            <div>
                            <span>溫度：</span>
                            <span>${returnText(value.weatherElement, 2)}</span>
                            <span>~</span>
                            <span>${returnText(value.weatherElement, 4)}</span>
                            <span>${returnText(value.weatherElement, 4, 'parameterUnit')}</span>
                            </div>
                        </div>                       
                    </div>
                `
            })
        }

        // 取得數值
        function returnText(item, key, select = 'parameterName') {
            return item[key].time[0].parameter[select];
            // item -> 帶地區的整體內容
            // [0]wx, [1]Pop, [2]CI, [3]MinT, 4[MaxT]
            // select -> 預設會選到的數值
        }

        // 1. 取得到的標題
        // 2. 取得所有縣市
        // 3. 現在的天氣相關資訊都要取得
    </script>
</body>

</html>
